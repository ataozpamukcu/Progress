<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Paper Practice</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="past-papers">
    <div class="page-shell">
      <nav class="page-nav" aria-label="Tracker pages">
        <a class="page-nav__link" href="./index.html">Courses</a>
        <a class="page-nav__link" href="./study-plan.html">Study Plan</a>
        <a class="page-nav__link page-nav__link--active" href="./past-papers.html">Past Papers</a>
        <a class="page-nav__link" href="./completed.html">Completed</a>
      </nav>

      <div class="storage-banner storage-banner--loading" id="storage-banner" aria-live="polite" role="status"></div>

      <header class="hero">
        <div class="hero-copy">
          <div class="hero-course-list" id="hero-course-list"></div>
        </div>

        <section class="overview-card" aria-labelledby="overview-title">
          <p class="overview-label" id="today-label">Today</p>
          <p class="today-date" id="today-date"></p>
          <div class="overall-progress">
            <div class="overall-progress__meta">
              <h2 id="overview-title">Past Paper Progress</h2>
              <span id="overall-percent"></span>
            </div>
            <div class="progress-track progress-track--large" aria-hidden="true">
              <div class="progress-fill" id="overall-progress-fill"></div>
            </div>
            <p class="overview-footnote" id="overall-summary"></p>
          </div>
        </section>
      </header>

      <main class="dashboard">
        <section class="spotlight-panel" aria-labelledby="exam-title">
          <div class="panel-heading">
            <h2 id="exam-title">Exam Countdown</h2>
            <p>The taught module exam dates alongside your past paper practice.</p>
          </div>
          <div class="deadline-list" id="exam-list"></div>
        </section>

        <section class="courses-panel" aria-labelledby="past-paper-title">
          <div class="panel-heading">
            <h2 id="past-paper-title">Past Paper Practice</h2>
            <p>
              Keep it simple: Condensed in order first, Nano Part A/B checks
              next, QM2 maintenance only, and GR later.
            </p>
          </div>
          <div class="past-paper-list" id="past-paper-list"></div>
        </section>
      </main>
    </div>

    <script src="./study-plan-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
